[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "obis-parser"
dynamic = ["version"]
description = "Dependency-free OBIS parser and measurement catalog for smart meters and energy gateways"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
keywords = ["smart-meter", "obis", "energy", "metering", "cosem", "sml", "iec-62056-6-1", "din-43863-3", "smgw"]
authors = [
    { name = "Jannick Fahlbusch", email = "git@jf-projects.de" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: System :: Hardware",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage   = "https://github.com/jannickfahlbusch/obis-parser"
Repository = "https://github.com/jannickfahlbusch/obis-parser"
Issues     = "https://github.com/jannickfahlbusch/obis-parser/issues"
Changelog  = "https://github.com/jannickfahlbusch/obis-parser/blob/main/CHANGELOG.md"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "obis_parser/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["obis_parser"]

[tool.hatch.build.targets.sdist]
exclude = ["/.gitea", "/.github", "/uv.lock"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=obis_parser --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["obis_parser"]
omit = ["obis_parser/_version.py"]

[tool.coverage.report]
show_missing = true
fail_under = 95

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.12",
]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["obis_parser/_version.py"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
    "D203",    # no-blank-line-before-class (incompatible with formatter)
    "D212",    # multi-line-summary-first-line (incompatible with formatter)
    "D213",    # multi-line-summary-second-line
    "COM812",  # incompatible with formatter
    "ISC001",  # incompatible with formatter

    # Docstring noise — small lib with clear naming
    "D100",    # Missing docstring in public module
    "D104",    # Missing docstring in public package
    "D105",    # Missing docstring in magic method
    "D107",    # Missing docstring in __init__
    "D400",    # First line should end with a period
    "D401",    # First line of docstring should be in imperative mood
    "D415",    # First line should end with period/question/exclamation

    # Copyright header pedantry
    "CPY001",  # Missing copyright notice at top of file

    # False positives on protocol / hex constants
    "PLR2004", # Magic value used in comparison

    # Type checking imports
    "TC001",   # Move app import into TYPE_CHECKING block
    "TC003",   # Move stdlib import into TYPE_CHECKING block
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # Use of assert detected — expected in tests
    "ANN",     # Missing type annotations — noisy in tests
    "D",       # Missing docstrings — noisy in tests
    "SLF001",  # Private member access — tests verify internal state
    "INP001",  # Implicit namespace package — tests dir intentionally has no __init__
    "PT012",   # pytest.raises with multiple statements — sometimes unavoidable
    "TC002",   # Move third-party import into TYPE_CHECKING — pointless for test deps
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.mccabe]
max-complexity = 25
